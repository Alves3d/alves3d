<style>
:root{
  --bg:#080808; --bg2:#0d0d0f; --surface:#141416; --surface2:#1c1c20;
  --accent:#4176e1; --accent2:#5b8ff9; --cyan:#3fd0e0;
  --text:#f0ede6; --text2:#a8a49e; --text3:#6f6b66;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --wpp:#25D366; --wpp2:#1db954;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --serif:'Bebas Neue',Impact,sans-serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --pad:clamp(16px,4vw,48px);
  --ease:cubic-bezier(.22,1,.36,1);
  --navh:66px;
}
:root[data-theme="light"]{
  --bg:#f7f7f5; --bg2:#efefec; --surface:#ffffff; --surface2:#f1f1ef;
  --accent:#2f5fd0; --accent2:#4176e1; --cyan:#0e9fb3;
  --text:#18181b; --text2:#5f5f66; --text3:#8f8f96;
  --border:rgba(0,0,0,.09); --border2:rgba(0,0,0,.16);
  --shadow:0 18px 50px rgba(20,20,40,.12);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden;transition:background .35s,color .35s}
img{max-width:100%;display:block}
a{color:inherit}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.ic{width:1em;height:1em;flex-shrink:0;fill:currentColor}

/* NAV */
.nav{position:sticky;top:0;z-index:100;height:var(--navh);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 var(--pad);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.nav-left{display:flex;align-items:center;gap:14px}
.logo{font-family:var(--serif);font-size:25px;letter-spacing:3px;text-decoration:none;line-height:1}
.logo em{font-style:normal;color:var(--accent)}
.nav-links{display:flex;gap:26px;list-style:none}
.nav-links a{text-decoration:none;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);transition:color .2s}
.nav-links a:hover{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:var(--surface);color:var(--text);display:grid;place-items:center;transition:border-color .2s,color .2s,transform .3s var(--ease);text-decoration:none}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:17px;height:17px}
#themeBtn:hover{transform:rotate(18deg)}
.i-sun{display:none}
:root[data-theme="light"] .i-sun{display:block}
:root[data-theme="light"] .i-moon{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:100px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;padding:14px 24px;transition:transform .25s var(--ease),background .2s,border-color .2s,box-shadow .25s;white-space:nowrap;line-height:1.2}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-wpp{background:var(--wpp);color:#06260f}
.btn-wpp:hover{background:var(--wpp2);transform:translateY(-2px);box-shadow:0 12px 32px rgba(37,211,102,.28)}
.btn-ghost{border-color:var(--border2);color:var(--text);background:transparent}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:9px 16px;font-size:13px}
.btn .ic{font-size:19px}

/* LAYOUT */
.page{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,4vw,60px);padding:28px var(--pad) 40px;max-width:1360px;margin:0 auto;align-items:start}
.gallery{position:sticky;top:calc(var(--navh) + 20px)}

/* GALERIA */
.g-main{position:relative;border-radius:22px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.g-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.g-track::-webkit-scrollbar{display:none}
.g-slide{position:relative;flex:0 0 100%;aspect-ratio:1;scroll-snap-align:center;overflow:hidden;isolation:isolate;cursor:zoom-in}
.g-slide::before{content:'';position:absolute;inset:-30px;z-index:-1;background:var(--img) center/cover no-repeat;filter:blur(30px) saturate(1.2);opacity:.5}
.g-slide img{width:100%;height:100%;object-fit:contain}
.g-ph{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;color:var(--text3)}
.g-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);display:grid;place-items:center;transition:background .2s,opacity .2s;z-index:2}
.g-btn:hover{background:var(--accent);color:#fff}
.g-btn svg{width:20px;height:20px}
.g-prev{left:12px}.g-next{right:12px}
.g-prev svg{transform:rotate(180deg)}
.g-count{position:absolute;right:12px;bottom:12px;z-index:2;font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 10px;border-radius:100px}
.g-zoom{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;align-items:center;gap:6px;font-size:12px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 11px;border-radius:100px;pointer-events:none}
.g-zoom svg{width:13px;height:13px}
.g-thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.g-thumbs::-webkit-scrollbar{display:none}
.g-thumb{flex:0 0 68px;height:68px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--surface2);padding:0;opacity:.6;transition:opacity .2s,border-color .2s}
.g-thumb img{width:100%;height:100%;object-fit:cover}
.g-thumb.on{opacity:1;border-color:var(--accent)}

/* INFO */
.crumb{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px}
.crumb a{text-decoration:none;color:var(--text2)}
.crumb a:hover{color:var(--accent)}
.p-cat{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.p-name{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.8vw,64px);line-height:.95;letter-spacing:.5px;margin:6px 0 8px}
.p-code{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.08em}
.price-box{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:22px 0;padding:18px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.price-lbl{font-size:12px;color:var(--text3)}
.price-val{font-family:var(--serif);font-size:52px;line-height:.95;letter-spacing:.5px}
.price-note{font-size:12px;color:var(--text2);max-width:220px;text-align:right}
.block{margin-bottom:22px}
.lbl{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.lbl b{font-family:var(--sans);font-size:14px;letter-spacing:0;text-transform:none;color:var(--text);font-weight:600}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.var{display:inline-flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:100px;border:1px solid var(--border2);background:var(--surface);font-size:14px;font-weight:500;transition:all .2s var(--ease)}
.var.no-img{padding-left:14px}
.var img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.var:hover{border-color:var(--text3)}
.var[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:0 0 0 1px var(--accent)}
.var-price{font-family:var(--mono);font-size:11px;color:var(--text3)}
.var-desc{font-size:14px;color:var(--text2);margin-top:10px;white-space:pre-line}
.inp{width:100%;height:48px;border-radius:14px;border:1px solid var(--border2);background:var(--surface);padding:0 16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--text3)}
.row2{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.qty{display:inline-flex;align-items:center;height:48px;border:1px solid var(--border2);border-radius:100px;background:var(--surface)}
.qty button{width:46px;height:46px;background:none;border:none;font-size:20px}
.qty button:hover{color:var(--accent)}
.qty output{min-width:34px;text-align:center;font-family:var(--mono)}
.total{font-size:13px;color:var(--text2);min-height:20px;margin-top:8px}
.total b{color:var(--text)}
.cta{display:flex;gap:10px;margin-top:6px}
.cta .btn-wpp{flex:1;padding:17px 24px;font-size:16px}
.share{width:56px;height:56px;flex-shrink:0;padding:0}
.share svg{width:20px;height:20px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.perk{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--border);font-size:13px;color:var(--text2);line-height:1.35}
.perk svg{width:18px;height:18px;color:var(--accent);flex-shrink:0;margin-top:1px}
.perk b{display:block;color:var(--text);font-weight:600;font-size:13px}
.desc{color:var(--text2);white-space:pre-line;font-size:15px;line-height:1.7}
.specs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.spec{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13px}
.spec span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-right:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-family:var(--mono);font-size:11px;color:var(--text3);padding:3px 10px;border-radius:100px;border:1px solid var(--border)}
.back{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:14px;color:var(--text2);text-decoration:none}
.back:hover{color:var(--accent)}
.back svg{transform:rotate(180deg)}

/* RELACIONADOS */
.related{padding:20px var(--pad) 60px;max-width:1360px;margin:0 auto}
.rel-title{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4vw,50px);letter-spacing:1px;line-height:1;margin-bottom:20px}
.rel-title em{font-style:normal;color:var(--accent)}
.rel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;text-decoration:none;transition:border-color .3s,transform .35s var(--ease)}
.rcard:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-4px)}
.rcard .im{position:relative;aspect-ratio:1;overflow:hidden;isolation:isolate;background:var(--surface2)}
.rcard .im::before{content:'';position:absolute;inset:-20px;z-index:-1;background:var(--img) center/cover;filter:blur(22px);opacity:.5}
.rcard img{width:100%;height:100%;object-fit:contain}
.rcard .bd{padding:11px 13px 13px}
.rcard .nm{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .pr{font-family:var(--serif);font-size:22px;margin-top:4px}
.rcard .pr small{font-family:var(--sans);font-size:11px;color:var(--text3);margin-right:4px}

/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:300;background:#050505;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff;font-family:var(--mono);font-size:12px}
.lb-close{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;font-size:24px;line-height:1}
.lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;overflow:auto;display:grid;place-items:center;scrollbar-width:none}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.lb-slide.zoom{display:block;scroll-snap-align:none}
.lb-slide.zoom img{max-width:none;max-height:none;width:220%;cursor:zoom-out}
.lb-hint{text-align:center;color:rgba(255,255,255,.55);font-size:12px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.lb .g-btn{background:rgba(255,255,255,.12);color:#fff}

/* BARRA FIXA (celular) */
.buybar{display:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);opacity:0;z-index:400;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:100px;font-size:14px;font-weight:500;transition:all .35s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.skel{border-radius:16px;background:linear-gradient(90deg,var(--surface2) 25%,color-mix(in srgb,var(--surface2) 60%,var(--border2)) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.nf{text-align:center;padding:80px var(--pad)}
.nf h1{font-family:var(--serif);font-weight:400;font-size:52px;letter-spacing:1px;margin-bottom:10px}
.nf p{color:var(--text2);margin-bottom:24px}
.nf .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fade{animation:fade .6s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}

footer{padding:30px var(--pad) 36px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
footer p{font-family:var(--mono);font-size:11px;color:var(--text3)}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer nav a{text-decoration:none;font-size:14px;color:var(--text2)}
footer nav a:hover{color:var(--accent)}

@media (max-width:960px){ .nav-links{display:none} }
@media (max-width:860px){
  .page{grid-template-columns:1fr;padding-top:0;padding-left:0;padding-right:0;gap:18px}
  .gallery{position:relative;top:0}
  .g-main{border-radius:0;border-left:0;border-right:0;border-top:0}
  .g-thumbs{padding:2px var(--pad)}
  .info{padding:0 var(--pad)}
  .g-btn{display:none}
  .rel-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
@media (max-width:640px){
  :root{--navh:60px}
  .nav .wpp-txt{display:none}
  .nav .btn-wpp{width:38px;height:38px;padding:0}
  .price-val{font-size:44px}
  .price-note{text-align:left;max-width:none}
  .perks{grid-template-columns:1fr 1fr;gap:8px}
  .perk{padding:10px 12px;font-size:12px}
  .buybar{display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;bottom:0;z-index:95;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border2);transform:translateY(110%);transition:transform .4s var(--ease)}
  .buybar.show{transform:none}
  .buybar .bb-p{display:flex;flex-direction:column;line-height:1.1;min-width:0}
  .buybar .bb-p small{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .buybar .bb-p b{font-family:var(--serif);font-weight:400;font-size:28px}
  .buybar .btn{flex:1;padding:14px 16px}
  body{padding-bottom:80px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
(() => {
'use strict';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('#ano').textContent = new Date().getFullYear();

$('#themeBtn').addEventListener('click', () => {

});
// Voltar mantém o filtro do catálogo se a pessoa veio de lá
try { if (document.referrer && new URL(document.referrer).pathname.endsWith('catalogo.html')) $('#navBack').href = document.referrer; } catch(e){}

const varsDe = p => (p.tem_variacoes && Array.isArray(p.variacoes)) ? p.variacoes.filter(v => v && v.nome) : [];
const precoMin = p => {

};
const capa = p => {

};

let P = null;                 // produto atual
const st = { v: 0, qtd: 1, pers: '' };
let imgs = [];

/* ================= CARREGAR ================= */
async function load() {
  const id = new URLSearchParams(location.search).get('id');

}

    </div></div>`;
}

/* ================= TELA ================= */
function render() {
  const p = P, vs = varsDe(p);
  const catURL = `catalogo.html?cat=${encodeURIComponent(p.categoria)}`;
  const specs = [['Material', p.material], ['Tamanho', p.tamanho]].filter(([, v]) => v && String(v).trim());

  document.title = `${p.nome} — Alves.3D`;
  const desc = `${p.nome} em impressão 3D. A partir de R$${fmt(precoMin(p))}. Peça pelo WhatsApp e receba em todo o Brasil.`;
  $('#metaDesc').setAttribute('content', desc);
  addJsonLd(p);
  track('produto_ver', { produto: p.codigo, categoria: p.categoria });

  $('#content').innerHTML = `
  <div class="page">
    <div class="gallery fade">
      <div class="g-main">
        <div class="g-track" id="gTrack"></div>
        <button class="g-btn g-prev" id="gPrev" aria-label="Foto anterior"><svg class="ic"><use href="#i-arrow"/></svg></button>

        <span class="g-zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>Toque para ampliar</span>

    </div>

    <div class="info fade" style="animation-delay:.08s">
      <div class="crumb"><a href="catalogo.html">Catálogo</a>/<a href="${catURL}">${esc(p.categoria)}</a></div>
      <a class="p-cat" href="${catURL}">${esc(p.categoria)}</a>
      <h1 class="p-name">${esc(p.nome)}</h1>
      <div class="p-code">Cód. ${esc(p.codigo)}</div>

      <div class="price-box">
        <div><div class="price-lbl" id="priceLbl">${vs.length ? 'preço desta opção' : 'a partir de'}</div><div class="price-val" id="priceVal">R$—</div></div>
        <div class="price-note">Valor final confirmado no WhatsApp conforme tamanho, cores e detalhes.</div>
      </div>

      ${vs.length ? `
      <div class="block">
        <div class="lbl">Escolha a opção <b id="varName"></b></div>
        <div class="vars" id="vars">${vs.map((v, i) => `
          <button class="var${v.imagens && v.imagens[0] ? '' : ' no-img'}" data-i="${i}" aria-pressed="false">
            ${v.imagens && v.imagens[0] ? `<img src="${esc(v.imagens[0])}" alt="" loading="lazy">` : ''}
            ${esc(v.nome)}${v.preco != null ? ` <span class="var-price">R$${fmt(v.preco)}</span>` : ''}
          </button>`).join('')}</div>
        <div class="var-desc" id="varDesc"></div>
      </div>` : ''}

      <div class="block">
        <div class="lbl">Personalização <span style="text-transform:none;letter-spacing:0">(opcional)</span></div>
        <input class="inp" id="pers" maxlength="80" placeholder="Ex.: nome para gravar, cor preferida, frase…">
      </div>

      <div class="block">
        <div class="row2">
          <div><div class="lbl">Quantidade</div>
            <div class="qty"><button type="button" id="qMinus" aria-label="Diminuir">−</button><output id="qVal">1</output><button type="button" id="qPlus" aria-label="Aumentar">+</button></div>
          </div>
          <div class="total" id="total"></div>
        </div>
      </div>

      <div class="cta" id="mainCta">
        <a href="#" class="btn btn-wpp" id="wppBtn" target="_blank" rel="noopener"><svg class="ic"><use href="#i-wpp"/></svg>Pedir no WhatsApp</a>
        <button class="btn btn-ghost share" id="shareBtn" aria-label="Compartilhar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
      </div>

      <div class="perks">
        <div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>3 a 7 dias úteis</b>de produção</div></div>
        <div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg><div><b>Envio para todo o Brasil</b>com código de rastreio</div></div>
        <div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><div><b>Desconto a partir de 3 un.</b>ideal para presentes e brindes</div></div>
        <div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.6 0-1.4 1-2.4 2.4-2.4H18a3 3 0 0 0 3-3A9 9 0 0 0 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><div><b>Várias cores</b>escolha no pedido</div></div>
      </div>

      ${p.descricao ? `<div class="block"><div class="lbl">Sobre a peça</div><div class="desc">${esc(p.descricao)}</div></div>` : ''}
      ${specs.length ? `<div class="specs">${specs.map(([k, v]) => `<div class="spec"><span>${k}</span>${esc(v)}</div>`).join('')}</div>` : ''}
      ${(p.tags || []).length ? `<div class="tags">${p.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
      <a class="back" href="${catURL}"><svg class="ic"><use href="#i-arrow"/></svg>Mais peças de ${esc(p.categoria)}</a>
    </div>
  </div>`;

  // Eventos
  if (vs.length) {
    $('#vars').addEventListener('click', e => { const b = e.target.closest('.var'); if (b) { selectVar(+b.dataset.i); track('produto_opcao', { produto: P.codigo }); } });
  }
  $('#pers').addEventListener('input', e => { st.pers = e.target.value.trim(); updateOrder(); });
  $('#qMinus').onclick = () => { st.qtd = Math.max(1, st.qtd - 1); updateOrder(); };
  $('#qPlus').onclick = () => { st.qtd = Math.min(999, st.qtd + 1); updateOrder(); };
  $('#wppBtn').addEventListener('click', () => track('produto_whatsapp', { produto: P.codigo, origem: 'principal' }));
  $('#bbWpp').addEventListener('click', () => track('produto_whatsapp', { produto: P.codigo, origem: 'barra_fixa' }));
  $('#shareBtn').addEventListener('click', share);
  $('#gPrev').onclick = () => goTo(cur() - 1);
  $('#gNext').onclick = () => goTo(cur() + 1);
  $('#gTrack').addEventListener('scroll', onGalleryScroll, { passive: true });
  $('#gTrack').addEventListener('click', e => { const s = e.target.closest('.g-slide'); if (s && imgs[0]) openLb(+s.dataset.i); });
  $('#gThumbs').addEventListener('click', e => { const t = e.target.closest('.g-thumb'); if (t) goTo(+t.dataset.i); });

  // Barra fixa aparece quando o botão principal sai da tela
  new IntersectionObserver(([en]) => {
    const show = !en.isIntersecting && en.boundingClientRect.top < 0;
    $('#buybar').classList.toggle('show', show);
    $('#buybar').setAttribute('aria-hidden', !show);
    $('#bbWpp').tabIndex = show ? 0 : -1;
  }).observe($('#mainCta'));

  if (vs.length) selectVar(0); else { setImages(p.imagens || []); updateOrder(); }
}

/* ================= OPÇÕES / PEDIDO ================= */
function selectVar(i) {
  const vs = varsDe(P); if (!vs[i]) return;
  st.v = i;
  const v = vs[i];
  $$('#vars .var').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  $('#varName').textContent = v.nome;
  $('#varDesc').textContent = v.descricao || '';
  setImages(v.imagens && v.imagens.length ? v.imagens : (P.imagens || []));
  updateOrder();
}
function unitPrice() {
  const v = varsDe(P)[st.v];
  if (v && v.preco != null) return +v.preco;
  return varsDe(P).length ? (P.preco != null ? +P.preco : precoMin(P)) : (P.preco != null ? +P.preco : null);
}
function updateOrder() {
  const vs = varsDe(P), v = vs.length ? vs[st.v] : null, up = unitPrice();
  $('#qVal').textContent = st.qtd;
  $('#priceVal').textContent = 'R$' + fmt(up);
  $('#bbPrice').textContent = 'R$' + fmt(up);
  $('#bbLbl').textContent = v ? v.nome : 'a partir de';
  $('#total').innerHTML = st.qtd > 1 && up != null
    ? `Total estimado: <b>R$${fmt(up * st.qtd)}</b>${st.qtd >= 3 ? ' · <span style="color:var(--wpp)">com desconto no WhatsApp</span>' : ''}`
    : '';

  let m = `Olá! Vi no site e quero pedir:\n\nProduto: ${P.nome} (${P.codigo})`;
  if (v) m += `\nOpção: ${v.nome}`;
  m += `\nQuantidade: ${st.qtd}`;
  if (st.pers) m += `\nPersonalização: ${st.pers}`;
  m += `\nPreço: R$${fmt(up)}${st.qtd > 1 ? ' cada' : ''}`;
  m += `\n\n${SITE}/produto.html?id=${encodeURIComponent(P.codigo)}`;
  const link = wppLink(m);
  $('#wppBtn').href = link; $('#bbWpp').href = link;
}

/* ================= GALERIA ================= */
function setImages(list) {
  imgs = list.length ? list : [''];
  $('#gTrack').innerHTML = imgs.map((src, i) => `
    <div class="g-slide" data-i="${i}" style="--img:url('${esc(src)}')">
      ${src ? `<img src="${esc(src)}" alt="${esc(P.nome)} — foto ${i + 1}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} draggable="false">` : '<div class="g-ph">🖨️</div>'}
    </div>`).join('');
  $('#gTrack').scrollLeft = 0;
  const many = imgs.length > 1;
  $('#gThumbs').innerHTML = many ? imgs.map((src, i) => `<button class="g-thumb${i ? '' : ' on'}" data-i="${i}" aria-label="Foto ${i + 1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('') : '';
  $('#gPrev').style.visibility = $('#gNext').style.visibility = many ? '' : 'hidden';
  $('.g-zoom').style.display = imgs[0] ? '' : 'none';
  updateCount(0);
}
const cur = () => { const t = $('#gTrack'); return Math.round(t.scrollLeft / t.clientWidth); };
function goTo(i) {
  const t = $('#gTrack'), n = imgs.length;
  i = (i + n) % n;
  t.scrollTo({ left: i * t.clientWidth, behavior: 'smooth' });
}
function updateCount(i) {
  $('#gCount').textContent = `${i + 1} / ${imgs.length}`;
  $('#gCount').style.display = imgs.length > 1 ? '' : 'none';
  $$('#gThumbs .g-thumb').forEach((b, k) => {
    b.classList.toggle('on', k === i);
    if (k === i) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  });
}
let gT;
function onGalleryScroll() { clearTimeout(gT); gT = setTimeout(() => updateCount(cur()), 60); }

/* Lightbox com deslizar e zoom por toque duplo */
const lb = $('#lb'), lbTrack = $('#lbTrack');
function openLb(i) {
  lbTrack.innerHTML = imgs.map(src => `<div class="lb-slide"><img src="${esc(src)}" alt="" draggable="false"></div>`).join('');
  lb.classList.add('open'); document.body.style.overflow = 'hidden';
  $('#lbPrev').style.display = $('#lbNext').style.display = imgs.length > 1 ? '' : 'none';
  requestAnimationFrame(() => { lbTrack.scrollLeft = i * lbTrack.clientWidth; lbCount(); });
  track('produto_ampliar_foto', { produto: P.codigo });
}
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; lbTrack.innerHTML = ''; }
const lbCur = () => Math.round(lbTrack.scrollLeft / lbTrack.clientWidth);
const lbCount = () => { $('#lbCount').textContent = `${lbCur() + 1} / ${imgs.length}`; };
function lbGo(d) { unzoom(); const n = imgs.length; lbTrack.scrollTo({ left: ((lbCur() + d + n) % n) * lbTrack.clientWidth, behavior: 'smooth' }); }
function unzoom() { $$('#lbTrack .lb-slide.zoom').forEach(s => s.classList.remove('zoom')); lbTrack.style.overflowX = ''; }
function toggleZoom(slide, x, y) {
  const img = slide.querySelector('img');
  if (slide.classList.contains('zoom')) { unzoom(); return; }
  const r = img.getBoundingClientRect();
  const fx = (x - r.left) / r.width, fy = (y - r.top) / r.height;
  slide.classList.add('zoom'); lbTrack.style.overflowX = 'hidden';
  requestAnimationFrame(() => {
    slide.scrollLeft = fx * img.offsetWidth - slide.clientWidth / 2;
    slide.scrollTop = fy * img.offsetHeight - slide.clientHeight / 2;
  });
}
let lastTap = 0;
lbTrack.addEventListener('dblclick', e => { const s = e.target.closest('.lb-slide'); if (s) toggleZoom(s, e.clientX, e.clientY); });
lbTrack.addEventListener('touchend', e => {
  const now = Date.now(), t = e.changedTouches[0];
  if (now - lastTap < 300) { const s = e.target.closest('.lb-slide'); if (s) { e.preventDefault(); toggleZoom(s, t.clientX, t.clientY); } lastTap = 0; }
  else lastTap = now;
});
lbTrack.addEventListener('scroll', () => { clearTimeout(gT); gT = setTimeout(lbCount, 60); }, { passive: true });
lbTrack.addEventListener('click', e => { if (e.target === lbTrack || e.target.classList.contains('lb-slide')) closeLb(); });
$('#lbClose').onclick = closeLb;
$('#lbPrev').onclick = () => lbGo(-1);
$('#lbNext').onclick = () => lbGo(1);
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') lbGo(1);
  if (e.key === 'ArrowLeft') lbGo(-1);
});

/* ================= COMPARTILHAR ================= */
async function share() {
  const url = `${SITE}/produto.html?id=${encodeURIComponent(P.codigo)}`;
  const data = { title: P.nome + ' — Alves.3D', text: `Olha essa peça: ${P.nome}`, url };
  track('produto_compartilhar', { produto: P.codigo });
  if (navigator.share) { try { await navigator.share(data); } catch(e){} return; }
  try { await navigator.clipboard.writeText(url); toast('Link copiado!'); }
  catch (e) { window.open(wppLink(`${data.text}\n${url}`), '_blank', 'noopener'); }
}
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }

/* ================= RELACIONADOS ================= */
async function loadRelated() {
  try {
    const rows = await api(`select=codigo,nome,categoria,preco,imagens,destaque,tem_variacoes,variacoes&publicado=eq.true&codigo=neq.${encodeURIComponent(P.codigo)}&order=destaque.desc,created_at.desc&limit=60`);
    const same = rows.filter(r => r.categoria === P.categoria);
    const others = rows.filter(r => r.categoria !== P.categoria);
    const pick = [...same, ...others].filter(r => capa(r)).slice(0, 4);
    if (!pick.length) return;
    const sec = $('#related');
    sec.innerHTML = `<h2 class="rel-title">Você também <em>pode gostar</em></h2>
      <div class="rel-grid">${pick.map(r => `
        <a class="rcard" href="produto.html?id=${encodeURIComponent(r.codigo)}">
          <div class="im" style="--img:url('${esc(capa(r))}')"><img src="${esc(capa(r))}" alt="${esc(r.nome)}" loading="lazy"></div>
          <div class="bd"><div class="nm">${esc(r.nome)}</div><div class="pr"><small>a partir de</small>R$${fmt(precoMin(r))}</div></div>
        </a>`).join('')}</div>`;
    sec.hidden = false;
  } catch (e) {}
}

/* ================= SEO (dados estruturados) ================= */
function addJsonLd(p) {
  const s = document.createElement('script');
  s.type = 'application/ld+json';
  const imgsAll = [...(p.imagens || []), ...varsDe(p).flatMap(v => v.imagens || [])].slice(0, 6);
  s.textContent = JSON.stringify({
    '@context': 'https://schema.org', '@type': 'Product',
    name: p.nome, sku: p.codigo, category: p.categoria,
    description: (p.descricao || p.nome).slice(0, 500),
    image: imgsAll, brand: { '@type': 'Brand', name: 'Alves.3D' },
    offers: { '@type': 'Offer', priceCurrency: 'BRL', price: precoMin(p) ?? undefined, availability: 'https://schema.org/InStock', url: `${SITE}/produto.html?id=${encodeURIComponent(p.codigo)}` }
  });
  document.head.appendChild(s);
}

load();
})();
</script>
